# ruff.toml — линтер проекта. Запуск: `python -m ruff check .`
#
# Набор правил намеренно узкий: ищем ДЕФЕКТЫ (мёртвый код, опечатки в именах,
# ловушки замыканий), а не расхождения в стиле. Замеры 2026-07-28: дефолтный
# набор ruff 0.16 дал 209 замечаний, набор "E4,E7,E9,F,B" — 206, и в обоих
# случаях подавляющее большинство было косметикой. Линтер, который выдаёт
# двести замечаний, не читают — его отключают целиком; поэтому здесь оставлены
# только правила, срабатывание которых стоит того, чтобы пойти и посмотреть код.

target-version = "py311"

# Целиком не включены:
#   E1/E2/E3/E5 — отступы, пробелы, длина строки. В проекте есть длинные строки
#                 с формулами и комментариями-обоснованиями; переносить их ради
#                 лимита — потеря читаемости.
#   E401/E402   — импорты не в начале файла. Штатный приём здесь: сначала
#                 sys.path.insert для внешних инструментов, потом импорт.
#   E701/E702   — несколько операторов в строке (107 срабатываний, чистый стиль).
#   E741        — «неоднозначные» имена вроде l/I/O.
exclude = [
    # Референс-копия облачного ноутбука DataLore. Не исполняется пайплайном
    # (CLAUDE.md: «выполняемый код — локальный Python-модуль, а не облачный
    # notebook»), правится только целиком при обновлении из DataLore — 95 из
    # 206 замечаний приходилось на него.
    "notebooks/reference",
]

[lint]
select = [
    "E9",    # синтаксис и недостижимый код
    "F",     # pyflakes: неиспользуемые импорты/переменные, необъявленные имена
    "B",     # flake8-bugbear: реальные ловушки (мутабельные аргументы и др.)
    "E711",  # `== None` вместо `is None`
    "E712",  # `== True` / `== False`
    "E713",  # `not x in y` вместо `x not in y`
    "E714",  # `not x is y` вместо `x is not y`
    "E722",  # голый `except:`
]

ignore = [
    # B023 «функция не связывает переменную цикла». В этом коде такие замыкания
    # (report.py:_median, cards_build.py:_x) вызываются ВНУТРИ той же итерации и
    # наружу не утекают — проверено вручную 2026-07-28, все 5 срабатываний
    # ложные. Цена решения: правило не поймает настоящее утекающее замыкание,
    # если такое появится.
    "B023",
    # B905 «zip без явного strict=». Класс дефекта настоящий (молчаливое
    # обрезание по короткой последовательности), но 30 срабатываний на уже
    # написанном коде — это отдельная задача на ревизию, а не то, что стоит
    # чинить попутно. Включить, когда дойдут руки проверить каждый zip.
    "B905",
    "B007",  # неиспользуемая переменная цикла — стиль
    "B028",  # warnings.warn без stacklevel — стиль
]

[lint.per-file-ignores]
# В тестах `== False` / `== True` — намеренно более строгая проверка, чем
# `not x`: последняя молча пропустила бы None/NaN вместо булева значения.
"tests/*" = ["E712"]
