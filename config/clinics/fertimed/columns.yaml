# config/clinics/fertimed/columns.yaml — соответствия имён колонок для выгрузки МИС 1С
# клиники Fertimed. Независим от config/columns.yaml (клиника A) — не расширяет и не
# наследует его, чтобы правки под одну клинику не могли задеть другую.
#
# Резолвер (ingest.resolve_columns, общий для всех клиник) приводит вход к
# каноническому имени по aliases. Бизнес-правила (парсинг возраста, фильтр
# когорты, fallback-значения, приоритет эмбриолог/врач, кодирование исхода)
# реализованы отдельно в src/embryo/clinics/fertimed.py — этот файл только
# отвечает за то, "как называется колонка", не "что с ней делать".

canonical:
  # --- идентичность/административные ---
  patient_id:     {aliases: ["Номер карты пациента"], required: true}
  patient_name:   {aliases: ["ФИО"], required: false}
  age:            {aliases: ["Возраст"], required: true}   # текст "34 года" — парсинг в fertimed.py
  attempt_no:     {aliases: ["№ попытки"], required: true}  # пусто -> 1 (fertimed.py)
  date_opu:       {aliases: ["Дата пункции"], required: false}
  date_et:        {aliases: ["Дата переноса"], required: false}
  treatment_type: {aliases: ["Лечение"], required: false}   # только для фильтра когорты, НЕ для метода оплодотворения

  # --- флаги метода оплодотворения (надёжные, в отличие от "Лечение") ---
  ivf_flag:       {aliases: ["IVF"], required: false}
  icsi_flag:      {aliases: ["ICSI"], required: false}

  # --- флаг похода за ответом ПГТ (иной портал/вендор, см. docs/FERTIMED.md) ---
  pgt_et_flag:    {aliases: ["PGT-ET"], required: false}

  # --- клинический контекст цикла: только описательный слой для итоговой
  #     интерпретации, НЕ участвует ни в фильтрации когорты, ни в расчёте KPI,
  #     ни во входе DT/TabPFN/DNN (владелец подтвердил 2026-07-31).
  #     Собирается в src/embryo/clinical.py, читается ролью
  #     clinical-context-analyst. См. docs/FERTIMED.md.
  #
  #     Префикс clin_/stim_ — не косметика: именно по нему clinical.py находит
  #     эти колонки, а _add_opu_aliases/_add_dt_aliases их не подхватывают,
  #     поэтому во вход моделей они физически не могут попасть.
  stim_protocol_type:        {aliases: ["Тип протокола"], required: false}
  stim_fsh_dose:             {aliases: ["Суммарная доза ФСГ"], required: false}
  stim_trigger:              {aliases: ["Триггер"], required: false}
  stim_protocol_start_day:   {aliases: ["Начало протокола, день мц"], required: false}
  stim_stimulation_start_day: {aliases: ["Начало стимуляции, день мц"], required: false}
  stim_duration_days:        {aliases: ["Длительность стимуляции"], required: false}
  clin_cycle_start_date:     {aliases: ["Дата начала"], required: false}
  clin_lmp_date:             {aliases: ["Дата последней менструации"], required: false}
  clin_fsh_basal:            {aliases: ["ФСГ"], required: false}   # базальный ФСГ пациентки, НЕ доза
  clin_opu_cycle_day:        {aliases: ["Пункция на день МЦ"], required: false}
  clin_dx_primary:           {aliases: ["Диагноз основной"], required: false}
  # Причина завершения программы ВРТ: 101/105 в июньской выгрузке. В когорте
  # отчёта почти всегда "Перенос эмбрионов" (по определению когорты), поэтому
  # ценность поля — в широкой lab-популяции, где живут "Остановка развития
  # эмбрионов", "Отсутствие оплодотворения", "Овуляция". clinical.py считает по
  # ней ДВА раздельных распределения с явно названными знаменателями.
  clin_termination_reason:   {aliases: ["Причина завершения программы ВРТ"], required: false}
  # Опечатка "сопуствующий" — в самой выгрузке 1С; правильное написание держим
  # вторым алиасом, чтобы починка на стороне МИС не сломала резолв.
  clin_dx_secondary:         {aliases: ["Диагноз сопуствующий", "Диагноз сопутствующий"], required: false}
  # КАФ: в майской выгрузке колонка содержала билинговые суммы (270–250344), в
  # июньской исправленной — физиологичные значения (max 30, r=0.93 с числом
  # фолликулов). Маппится в СОБСТВЕННОЕ имя clin_afc, а не в канонический "afc":
  # канонический afc уходит во вход DT (μ первой стадии ZINB, коэффициент 0.55)
  # и в normalize.impute_amh, а владелец решил (2026-07-31) пустить КАФ только в
  # интерпретацию. Защита диапазона — fertimed.AFC_PLAUSIBLE_MAX.
  clin_afc:                  {aliases: ["КАФ"], required: false}

  # --- ОКК/эмбриология ---
  # КАФ сознательно не маппится: колонка содержит билинговые суммы, а не АФК
  # (подтверждено анализом майской выгрузки, см. docs/FERTIMED.md). "afc"
  # остаётся неизвестным полем -> impute_amh автоматически берёт fallback на
  # follicles, это уже общая логика normalize.py.
  follicles:      {aliases: ["Количество фолликулов"], required: true}   # пропуск -> occ (fertimed.py)
  occ:            {aliases: ["Число ОКК"], required: true}
  inseminated:    {aliases: ["Число инсеминированных"], required: true}  # пусто -> строка не для анализа
  mii:            {aliases: ["Число MII"], required: false}
  two_pn:         {aliases: ["2 pN"], required: true}
  cleavage_d3:    {aliases: ["Число дробящихся на 3 день"], required: true}
  embryos_d5:     {aliases: ["Число эмбрионов 5 дня"], required: false}
  bl_total:       {aliases: ["Число Bl"], required: true}
  bl_good:        {aliases: ["Число Bl хор.кач-ва"], required: true}

  # --- перенос ---
  # "Исход переноса/инсеминации" — имя колонки в исправленной выгрузке 1С
  # (июнь 2026); "Исход переноса" — в прежней шестимесячной. Держим оба, чтобы
  # старые файлы продолжали читаться.
  transfer_outcome: {aliases: ["Исход переноса/инсеминации", "Исход переноса"], required: true}
  transfer_day:     {aliases: ["День переноса"], required: true}   # пусто -> 5 (fertimed.py)
  transferred:      {aliases: ["Перенесено эмбрионов"], required: true}
  frozen:           {aliases: ["Заморожено эмбрионов"], required: true}
  frozen_blastocysts: {aliases: ["Заморожено бластоцист"], required: false}  # суммируется с frozen (fertimed.py)

  # --- три раздельные роли эмбриолога/врача (см. docs/FERTIMED.md за приоритетом) ---
  embryologist_opu:  {aliases: ["Эмбриолог на пункции"], required: false}
  embryologist_fert: {aliases: ["Эмбриолог, проводивший оплодотворение"], required: false}
  embryologist_et:   {aliases: ["Эмбриолог на переносе"], required: false}
  doctor_opu:        {aliases: ["Врач на пункции"], required: false}
  doctor_et:         {aliases: ["Врач на переносе"], required: false}

  amh:            {aliases: ["АМГ"], required: false}
  bmi:            {aliases: ["ИМТ", "BMI"], required: false}

# ФИО Сурмамы, Партнёр, Fresh/Vitrified OD (+коды доноров), ДС/ДЭ (+коды доноров),
# SMF, FET, PGT-TVP, Донация, источник финансирования, Двойной перенос,
# Осложнения, Толщина эндометрия, Катетер, Внематочная/Плодные яйца/Роды/Срок
# родов/Метод родоразрешения/Количество детей/Комментарий — намеренно НЕ
# маппятся (владелец подтвердил: не используются в этом отчёте). Попадут в
# unknown-предупреждение резолвера — это ожидаемо, не ошибка.
# Диагнозы и КАФ вышли из этого списка 2026-07-31 — см. блок clin_* выше.

# Владелец подтвердил (2026-07-18): в криоперенос-строках счётчики воронки
# (2 pN и далее) отражают исходный протокол оплодотворения целиком, а не эту
# конкретную попытку переноса — включение этих строк в Σ2PN/ΣBl искусственно
# занижает BlR/TGBDR. Эти строки остаются в общем анализе (DT/TabPFN/
# review-list/OZEMA не затронуты) — исключаются только из KPI-агрегации, см.
# kpi.funnel_exclusion_mask.
funnel_exclusion:
  stale_funnel_tokens: ["Криоперенос"]  # значение treatment_type ("Лечение")

# Владелец подтвердил (2026-07-31): лабораторные KPI — показатели работы
# лаборатории, а не переносов, поэтому считаются по ВСЕМ циклам выгрузки
# независимо от того, был перенос или нет. Из широкой lab-популяции
# (fertimed.prepare_wide -> все таблицы KPI + OZEMA) уходят только категории
# "Лечение", не являющиеся свежим циклом ЭТОЙ лаборатории:
#   * "Криоперенос" — счётчики воронки перенесены 1С из исходного протокола, а
#     сам протокол уже присутствует в популяции отдельной строкой; оставить
#     обе означало бы посчитать одну пункцию дважды.
#   * "Инсеминация" — ВМИ, другая модальность (в июньской выгрузке отсутствует,
#     в шестимесячной 71 строка).
# "Только пункция" НЕ здесь: пункция состоялась и OCCR/MIIR врача обязаны её
# считать — она уходит только из метрик эмбриолога, см. competency_exclusion.
# "ПГТ на размороженных эмбрионах" тоже остаётся: у этих строк нет ни
# инсеминированных, ни 2PN, поэтому ни в один знаменатель они не попадают.
# Отчётную когорту (вход DT/TabPFN/DNN, review-list) этот список НЕ трогает —
# там продолжает работать fertimed._cohort_mask с гейтом по исходу.
lab_population:
  excluded_treatment_tokens: ["Криоперенос", "Инсеминация"]

competency_exclusion:
  # Строки, остающиеся в таблице KPI врача, но уходящие из таблицы эмбриолога:
  # пункция состоялась (фолликулы/ОКК/MII заполнены у 10 из 13 строк июня), но
  # до инсеминации цикл не дошёл, поэтому наблюдения FR/ClR/BlR/TGBDR/DegR/3pNR
  # в строке нет вовсе. Владелец подтвердил 2026-07-31.
  embryologist_only_treatment_tokens: ["Только пункция"]
