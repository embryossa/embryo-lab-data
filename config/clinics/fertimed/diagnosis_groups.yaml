# config/clinics/fertimed/diagnosis_groups.yaml — группировка кодов МКБ-10
# (номенклатура РФ) из полей "Диагноз основной"/"Диагноз сопуствующий"
# выгрузки 1С в укрупнённые клинические классы.
#
# ЗАЧЕМ. Сырой код сам по себе не даёт агенту считать доли по когорте: N97.1
# и N70.1 — один и тот же трубно-перитонеальный сюжет, а N97.8 "другие формы"
# в этой выгрузке стоит у 65 из 130 упоминаний и как отдельная категория
# бесполезен. Группа — это КРУПНАЯ КОРЗИНА для описательной статистики, а не
# диагноз: агент всегда получает и код, и группу, и обязан ссылаться на код.
#
# КАК ЧИТАЕТСЯ. Сопоставление по префиксу кода, самый длинный префикс
# выигрывает ("N97.1" точнее, чем "N97"). Регистр и пробелы игнорируются.
# Код без совпадения уходит в группу `fallback` — это НЕ ошибка, а честный
# признак того, что справочник надо дополнить.
#
# Владелец может править этот файл без изменения кода: src/embryo/clinical.py
# только читает его.

fallback: "прочее / вне справочника"

# Порядок в файле роли не играет — выигрывает длина префикса.
prefixes:
  # --- женское бесплодие, рубрика N97 ---
  "N97.0": "ановуляторное бесплодие"
  "N97.1": "трубно-перитонеальный фактор"
  "N97.2": "маточный фактор"
  "N97.3": "цервикальный фактор"
  "N97.4": "мужской фактор"
  "N97.8": "бесплодие, другие формы (N97.8)"
  "N97.9": "бесплодие неуточнённое (N97.9)"
  "N97":   "бесплодие, рубрика N97 без уточнения"
  "N46":   "мужской фактор"

  # --- трубно-перитонеальный/воспалительный сюжет вне N97.1 ---
  "N70":   "трубно-перитонеальный фактор"
  "N73.6": "трубно-перитонеальный фактор"
  "N73":   "воспалительные болезни таза"
  "N76":   "воспалительные болезни нижних отделов"
  "I86.2": "варикозное расширение вен таза"

  # --- эндометриоз ---
  "N80":   "эндометриоз"

  # --- овариальный резерв и эндокринология ---
  "E28.2": "СПКЯ"
  "E28.3": "сниженный овариальный резерв"
  "E28":   "дисфункция яичников, другая"
  "E03":   "гипотиреоз"
  "E05":   "тиреотоксикоз"
  "E10":   "сахарный диабет"
  "E11":   "сахарный диабет"
  "E66":   "ожирение"

  # --- матка и придатки, структурная патология ---
  "D25":   "миома матки"
  "D27":   "доброкачественное новообразование яичника"
  "N83":   "невоспалительные болезни яичника/трубы"
  "N84":   "полип женских половых органов"
  "N85":   "невоспалительные болезни матки, другие"
  "N86":   "эрозия/эктропион шейки матки"
  "N87":   "дисплазия шейки матки"
  "N88":   "невоспалительные болезни шейки матки, другие"
  "N60":   "доброкачественная дисплазия молочной железы"

  # --- нарушения цикла ---
  "N91":   "нарушения менструального цикла"
  "N92":   "нарушения менструального цикла"

  # --- невынашивание и акушерский анамнез ---
  "N96":   "привычное невынашивание"
  "O26.2": "привычное невынашивание"
  "O12":   "гестационные отёки/протеинурия в анамнезе"
  "O34.2": "рубец на матке после операции"

  # --- сопутствующее вне репродуктивной сферы ---
  "G40":   "эпилепсия"
  "G43":   "мигрень"

  # --- служебные/административные коды класса Z ---
  "Z31.8": "медицинская помощь по вопросам деторождения (Z31.8)"
  "Z31":   "медицинская помощь по вопросам деторождения"
  "Z32.1": "беременность подтверждённая (Z32.1)"
  "Z52.8": "донор органов/тканей, другой (Z52.8)"
  "Z76.4": "другой уточнённый тип обращения (Z76.4)"
